{{- if not .Values.database.existingSecret }}
{{- if not .Values.database.url }}
{{- fail "Set database.url or database.existingSecret — the api Deployment and migrate Job both need DATABASE_URL." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sulo-schema-builder.fullname" . }}
  labels:
    {{- include "sulo-schema-builder.labels" . | nindent 4 }}
  annotations:
    # Also a hook (no delete-policy, so it is never torn down): the migrate
    # Job is itself a pre-install/pre-upgrade hook, and Helm does not create
    # a release's *normal* resources (this Secret, without this annotation)
    # until every pre-install/pre-upgrade hook has already completed — a
    # fresh install would deadlock, the migrate Job forever waiting on a
    # Secret Helm won't create until that same Job finishes. Giving this a
    # lower hook-weight runs it first, in the same hook phase, so it exists
    # in time. Known, accepted trade-off: a resource that is *only* a hook
    # (as this becomes) isn't tracked for cleanup by `helm uninstall` — see
    # this chart's README.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.database.url | quote }}
{{- end }}
