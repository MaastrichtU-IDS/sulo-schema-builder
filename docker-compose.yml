services:

  # ─── Node.js / Fastify: serves the built React SPA and the REST API from
  # one process, backed by embedded SQLite — no separate frontend container.
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    ports:
      - "8080:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      DB_PATH: /app/data/sulo.db
    volumes:
      - api-data:/app/data
    networks:
      - sulo-net
    restart: unless-stopped

volumes:
  api-data:

networks:
  sulo-net:
    driver: bridge
