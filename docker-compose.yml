services:

  # ─── Node.js / Fastify: serves the built React SPA and the API from one
  # process.
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    ports:
      - "8080:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      # Required: the API defaults to loopback, and a container listening on
      # 127.0.0.1 is unreachable through the published port above.
      HOST: 0.0.0.0
    networks:
      - sulo-net
    restart: unless-stopped

networks:
  sulo-net:
    driver: bridge
