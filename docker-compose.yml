services:

  # ─── Node.js / Fastify: serves the built React SPA and the stateless API
  # (reasoning, upper-concept proxy) from one process. Schemas live in each
  # visitor's browser (IndexedDB) — the server stores no user data, so there
  # is no database and no volume to back up.
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    ports:
      - "8080:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      # Web deployment: per-visitor browser storage. 'sqlite' would revert to
      # the single-user shared-database mode the desktop app uses.
      SCHEMA_STORAGE: browser
      # Required: the API defaults to loopback, and a container listening on
      # 127.0.0.1 is unreachable through the published port above.
      HOST: 0.0.0.0
    networks:
      - sulo-net
    restart: unless-stopped

networks:
  sulo-net:
    driver: bridge
