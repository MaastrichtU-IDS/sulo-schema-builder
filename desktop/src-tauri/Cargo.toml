[package]
name = "sulo-schema-builder-desktop"
version = "0.1.0"
description = "SULO Schema Builder desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "rt", "rt-multi-thread"] }

[[bin]]
name = "sulo-schema-builder-desktop"
path = "src/main.rs"
