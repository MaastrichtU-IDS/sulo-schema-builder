# Development overrides — active automatically when running `docker compose up`
# Publishes a second, un-proxied port for debugging and enables API hot reload.

services:
  api:
    build:
      target: development
    volumes:
      - ./api/src:/app/src:ro
      - ./sparql/files:/shex-files:ro
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    ports:
      - "3000:3000"   # direct API access for curl/Postman
