name: CI

# Fast gate on every change: typecheck and unit tests for both packages.
# Deliberately no Rust, Tauri or native packaging here — that lives in
# release.yml and takes minutes rather than seconds.

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Redundant with schema-core's `prepare` hook (which makes `npm ci` above
      # produce dist/ on its own, including in release.yml and on a clean
      # clone). Kept as an explicit, named step so that a regression in that
      # hook fails here with an obvious message rather than as a TS2307 in the
      # typecheck below.
      - name: Build shared package
        run: npm run build -w @sulo/schema-core

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Catches build-only breakage (bad imports, Vite config) that tsc and
      # vitest both miss.
      - name: Build frontend
        run: npm run build -w sulo-schema-builder-frontend
